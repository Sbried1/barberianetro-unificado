
services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    # Datos del correo (SMTP_USER, SMTP_PASS, APP_URL) para "Olvidé mi
    # contraseña". Si no existe el archivo .env, el sitio arranca igual.
    env_file:
      - path: .env
        required: false
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: barberia_db
      MYSQL_USER: barberia
      MYSQL_PASSWORD: barberia123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./barberia_db.sql:/docker-entrypoint-initdb.d/barberia_db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql

volumes:
  mysql_data:
